[package]
name = "gramterm-tg"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "TDLib-backed Telegram client primitives for Gramterm"

[dependencies]
anyhow = "1"
tdlib-rs = { version = "1.4.0", features = ["download-tdlib", "static"] }
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

[build-dependencies]
tdlib-rs = { version = "1.4.0", features = ["download-tdlib"] }
